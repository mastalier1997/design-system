<!-- @dsCard group="Display" height=84 subtitle="secondary · default · outline · destructive" -->
<div style="font-family: var(--font-sans); display: flex; flex-wrap: wrap; gap: 8px; padding: 20px; background: var(--background)">
  <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); background: var(--secondary); color: var(--secondary-foreground); font: 600 12px/1 var(--font-sans); letter-spacing: 0.02em; text-transform: uppercase">Hamstrings</span>
  <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); background: var(--primary); color: var(--primary-foreground); font: 600 12px/1 var(--font-sans); letter-spacing: 0.02em; text-transform: uppercase">Push</span>
  <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border); color: var(--foreground); font: 600 12px/1 var(--font-sans); letter-spacing: 0.02em; text-transform: uppercase">3 sets</span>
  <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); background: var(--destructive); color: #FFFFFF; font: 600 12px/1 var(--font-sans); letter-spacing: 0.02em; text-transform: uppercase">Missed</span>
</div>
