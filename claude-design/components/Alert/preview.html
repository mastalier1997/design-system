<!-- @dsCard group="Feedback" height=190 subtitle="success · destructive" -->
<div style="font-family: var(--font-sans); display: flex; flex-direction: column; gap: 12px; padding: 20px; max-width: 440px; background: var(--background); color: var(--foreground)">
  <div role="status" style="display: flex; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M20 6 9 17l-5-5"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 2px"><strong style="font: 600 14px/20px var(--font-sans)">Workout saved</strong><span style="font: 400 14px/20px var(--font-sans); color: var(--muted-foreground)">Push day logged, 5 of 5 exercises.</span></div>
  </div>
  <div role="alert" style="display: flex; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); color: var(--destructive);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 2px"><strong style="font: 600 14px/20px var(--font-sans)">Couldn't sync</strong><span style="font: 400 14px/20px var(--font-sans); color: var(--muted-foreground)">You're offline. Changes are kept on this device.</span></div>
  </div>
</div>
