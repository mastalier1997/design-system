<!-- @dsCard group="Actions" height=150 subtitle="default · secondary · outline · ghost · destructive · link" -->
<div style="font-family: var(--font-sans); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 20px; background: var(--background); color: var(--foreground)">
  <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--primary); color: var(--primary-foreground); font: 500 14px/20px var(--font-sans);">Start workout</button>
  <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--secondary); color: var(--secondary-foreground); font: 500 14px/20px var(--font-sans);">Secondary</button>
  <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--background); color: var(--foreground); font: 500 14px/20px var(--font-sans); box-shadow: inset 0 0 0 1px var(--input);">Outline</button>
  <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--foreground); font: 500 14px/20px var(--font-sans);">Ghost</button>
  <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--destructive); color: #FFFFFF; font: 500 14px/20px var(--font-sans);">Delete workout</button>
  <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--primary); font: 500 14px/20px var(--font-sans); padding: 0 4px; text-decoration: underline; text-underline-offset: 4px;">View history</button>
  <button type="button" aria-label="Settings" style="width: 44px; height: 44px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--background); color: var(--foreground); display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button>
  <button disabled type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--primary); color: var(--primary-foreground); font: 500 14px/20px var(--font-sans); opacity: 0.5;">Disabled</button>
</div>
