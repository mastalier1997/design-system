<!-- @dsCard group="Navigation" height=90 subtitle="segmented tab list" -->
<div style="font-family: var(--font-sans); padding: 20px; background: var(--background)">
  <div role="tablist" aria-label="Workout view" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius-lg); background: var(--secondary)">
    <button type="button" role="tab" aria-selected="true" style="height: 38px; padding: 0 14px; border: 0; border-radius: var(--radius-md); background: var(--background); color: var(--foreground); font: 500 14px/20px var(--font-sans)">Today</button>
    <button type="button" role="tab" aria-selected="false" style="height: 38px; padding: 0 14px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--muted-foreground); font: 500 14px/20px var(--font-sans)">History</button>
    <button type="button" role="tab" aria-selected="false" style="height: 38px; padding: 0 14px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--muted-foreground); font: 500 14px/20px var(--font-sans)">Stats</button>
  </div>
</div>
