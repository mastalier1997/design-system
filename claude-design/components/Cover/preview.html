<!-- @dsCard height=288 -->
<div style="position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--background); font-family: var(--font-sans)">
  <style>
    .c-primary { fill: var(--primary); }
    .c-ink { fill: var(--foreground); }
    .c-stone { fill: var(--muted-foreground); }
    .c-blue { fill: var(--chart-2); }
    .c-ok { fill: var(--success); }
    .c-line { fill: none; stroke: var(--input); stroke-width: 1px; }
    .tile { rx: var(--radius-lg); }
  </style>
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true" style="position: absolute; inset: 0">
    <!--
      blocks: primary 2×2 slab (220×124), foreground 1×1 bleeding right, muted-foreground 1×2, chart-2 1×1, success half tile (state colour stays small)
      arrangement: a flush modular grid of workout-card tiles from x=496, 104×56 cells at a 12px gutter (space-3), slab top-centre, blocks bleed off the right edge
      pattern: geometric, modular, dense UI — tiles cut by radius-lg, some merged two-wide like stacked cards; chosen because Graphite is a list-of-cards app with borders, not shadows
      scales: cell 104×56, gutter space-3 (12px), inset space-6 (24px); corners radius-lg (10px); outlines in input (1px)
    -->
    <rect class="c-line tile" x="496.5" y="24.5" width="103" height="55"></rect>
    <rect class="c-primary tile" x="612" y="24" width="220" height="124"></rect>
    <rect class="c-ink tile" x="844" y="24" width="128" height="56"></rect>
    <rect class="c-stone tile" x="496" y="92" width="104" height="124"></rect>
    <rect class="c-line tile" x="844.5" y="92.5" width="127" height="55"></rect>
    <rect class="c-line tile" x="612.5" y="160.5" width="103" height="55"></rect>
    <rect class="c-blue tile" x="728" y="160" width="104" height="56"></rect>
    <rect class="c-ok tile" x="844" y="160" width="52" height="56"></rect>
    <rect class="c-line tile" x="908.5" y="160.5" width="63" height="55"></rect>
    <rect class="c-line tile" x="496.5" y="228.5" width="219" height="55"></rect>
    <rect class="c-line tile" x="728.5" y="228.5" width="103" height="55"></rect>
    <rect class="c-primary tile" x="844" y="228" width="128" height="56"></rect>
  </svg>
  <div style="position: absolute; left: 40px; bottom: 36px; max-width: 420px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 88px; line-height: 0.92; font-weight: 700; letter-spacing: -0.02em; color: var(--foreground)">Graphite</div>
    <div style="font-size: 14px; line-height: 20px; color: var(--muted-foreground)">Calm graphite surfaces and one violet accent, in light and dark.</div>
  </div>
</div>
